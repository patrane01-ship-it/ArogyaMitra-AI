name: ArogyaMitra CI

on:
  push:
    branches: [ main, temp, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-audit:
    name: Backend Security, Lints & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: arogya
          POSTGRES_PASSWORD: arogya_password
          POSTGRES_DB: arogya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Python Compileall
        run: python -m compileall -q backend

      - name: Run Ruff Linter
        run: ruff check backend/

      - name: Security Scan (Bandit)
        run: bandit -r backend/ -ll -ii

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit --desc on

      - name: Secret Leak Detection (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    name: Frontend Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run NPM Audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
